name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cheap, deterministic checks only: nothing here needs a controller or a
# running mock. Each folder is its own uv project with a committed uv.lock, and
# `--locked` fails the run if a lockfile is out of date with its pyproject.toml.
jobs:
  server:
    name: MCP server (ethernetip-python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethernetip-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      - name: Import package and entry point
        run: uv run --locked python -c "import ethernetip_mcp; from ethernetip_mcp.cli import main"

      # Building the server does not connect: the PLC session is opened in the
      # MCP lifespan, so this checks tool registration and schemas without a
      # device. (`ethernetip-mcp --help` is not usable as a check: the entry
      # point takes no arguments and starts the stdio server.)
      - name: Register MCP tools
        run: |
          uv run --locked python - <<'EOF'
          import asyncio

          from ethernetip_mcp.server import EtherNetIPMCPServer

          tools = asyncio.run(EtherNetIPMCPServer()._server.list_tools())
          assert tools, "no MCP tools registered"
          print(f"{len(tools)} tools: {', '.join(sorted(t.name for t in tools))}")
          EOF

  mock:
    name: Mock PLC (ethernetip-mock-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethernetip-mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q eip_mock_server.py

      - name: Import module
        run: uv run --locked python -c "import eip_mock_server"

      - name: Entry point help
        run: uv run --locked ethernetip-mock-server --help
