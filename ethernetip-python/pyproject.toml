[project]
name = "ethernetip-mcp"
version = "0.1.0"
description = "MCP server for Allen-Bradley EtherNet/IP controllers with tag tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents" }]
dependencies = [
    "anyio>=4.0.0",
    # mcp 2.x renamed FastMCP and moved its modules; this server targets 1.x.
    "mcp[cli]>=1.22.0,<2",
    "pydantic>=2.6.0",
    # eip_client.py sets pycomm3's _cfg["socket_timeout"]; re-check on upgrades.
    "pycomm3>=1.2.14,<1.3",
    "python-dotenv>=1.1.0",
]

[project.urls]
Repository = "https://github.com/IndustriAgents/EtherNetIP-MCP"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
ethernetip-mcp = "ethernetip_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: starts the mock PLC and drives the MCP server over stdio",
]
